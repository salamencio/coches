<html lang="es"><head><meta charset="utf-8">

<title>N-640 · Porto → San Tirso</title>
<style>
:root{--bg:#0d1216;--fg:#f2f4f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;max-width:calc(100vh*16/9);aspect-ratio:16/9;max-height:100%;background:#0d1216}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#menu{position:absolute;inset:0;z-index:5;display:flex;background:radial-gradient(circle at 30% 20%,#1d3a55,#0d1216 70%);overflow:auto;touch-action:pan-y}
.card{width:min(560px,94vw);margin:auto;padding:18px 20px;background:rgba(14,22,30,.92);border:1px solid #2a3a48;border-radius:16px;display:flex;flex-direction:column;gap:10px}
#menu h1{margin:0;font-size:26px;color:#ffb400}#menu h2{margin:0;font-size:18px}
#menu p{margin:0;color:#9fb3c2;font-size:13px}
#menu button,#menu .b,#menu input:not([type=checkbox]),#pm button{font:14px system-ui,sans-serif;padding:9px 12px;border-radius:9px;border:1px solid #3a4c5c;background:#16222d;color:#fff}
#menu button,#menu .b{cursor:pointer;text-align:center}#pm button{cursor:pointer}#pm{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);overflow:auto;touch-action:pan-y}#pm h2{margin:0;font-size:20px}
#menu button:hover,#menu .b:hover,#pm button:hover{background:#1f3142}
#solo,#go{background:#e8a200!important;color:#111!important;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1;min-width:90px}
details{border:1px solid #2a3a48;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}summary{cursor:pointer;color:#cfe3f1}
#ctl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:6px 0;align-items:center;font-size:13px}
#pl div{display:flex;align-items:center;gap:8px;padding:4px 0}#pl i{width:12px;height:12px;border-radius:50%;display:inline-block}
#st{font-size:12px;color:#9fe6b0;min-height:16px}
#sv{position:absolute;left:8px;top:110px;width:260px;height:150px;z-index:2;display:none;border-radius:8px;overflow:hidden;border:2px solid #fff}
#pad{display:none;position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:0 12px;pointer-events:none;z-index:3}
@media (pointer:coarse){body.play #pad{display:flex}}
#pad div{display:flex;gap:8px;pointer-events:auto}
#pad button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.38);color:#fff;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
</style>

 const dl=steer*Math.min(.62,1.5*10.3*2.6/(sa*sa+9)),vEff=(sa<2.2&&(K.u||K.d))?2.2*((speed<-.1||(K.d&&speed<.7))?-1:1):speed,drift=K.hb&&sa>8;

 const mh=wh-slip;wx+=(speed*Math.sin(mh)+vy*Math.cos(rh))*dt;wn+=(speed*Math.cos(mh)-vy*Math.sin(rh))*dt;vy*=1-5*dt;
 axS=acc;ayS+=(r*speed-ayS)*Math.min(1,dt*8)}
function respawn(){dmg=0;speed=0;vy=0;yawr=0;steer=0;gear=1;sig=0;slip=0;const back=Math.abs(psi)>1.57,q=rowPos(pos+Z0,back?-1.75:1.75);wx=q.x;wn=-q.z;wh=q.h+(back?Math.PI:0);state='play';toast('¡Reiniciado!')}
function boxHit(ax,ay,ah,aw,al,bx,by,bh,bw,bl){const dx=bx-ax,dy=by-ay;if(dx*dx+dy*dy>200)return false;
 const A=[[Math.sin(ah),Math.cos(ah)],[Math.cos(ah),-Math.sin(ah)]],B=[[Math.sin(bh),Math.cos(bh)],[Math.cos(bh),-Math.sin(bh)]];
 for(const u of[A[0],A[1],B[0],B[1]]){const d=Math.abs(dx*u[0]+dy*u[1]),ra=al/2*Math.abs(A[0][0]*u[0]+A[0][1]*u[1])+aw/2*Math.abs(A[1][0]*u[0]+A[1][1]*u[1]),rb=bl/2*Math.abs(B[0][0]*u[0]+B[0][1]*u[1])+bw/2*Math.abs(B[1][0]*u[0]+B[1][1]*u[1]);if(d>=ra+rb-.08)return false}return true}
function collide(){if(state!=='play')return;const pf=[Math.sin(wh),Math.cos(wh)],vpx=speed*Math.sin(wh-slip),vpn=speed*Math.cos(wh-slip);
 for(const c of cars){if(c.dead||c.hit>0)continue;const q=rowPos(c.z,c.x),cxw=q.x,cnw=-q.z;if(Math.abs(cxw-wx)>14||Math.abs(cnw-wn)>14)continue;

  dmg+=Math.min(30,rel*.4*(c.k==='bike'?.4:1));shake=.5;
  if(ahead)speed=Math.max(speed*.55,speed-rel*.4/(.5+.5*mass));else speed+=rel*.3;
  shove(side*.5);vy+=side*Math.min(3,rel*.08);yawr+=side*Math.min(.6,rel*.015);
  sendHit(c,c.k==='bike'?5:3.5);c.v*=.3;toast(c.v0<0?'¡Choque frontal!':'¡Choque!')}
 for(const k in others){const o=others[k];if(o.cd>0)continue;const q=rowPos(o.z,o.x),cxw=q.x,cnw=-q.z;if(Math.abs(cxw-wx)>14||Math.abs(cnw-wn)>14)continue;
  const oh=q.h+(o.h||0);if(!boxHit(wx,wn,wh,1.8,4.4,cxw,cnw,oh,1.8,4.4))continue;

function update(dt){time+=dt;mt-=dt;shake=Math.max(0,shake-dt*2);

{const sr=LS.get('n640route',null);if(sr&&sr.pts&&sr.pts.length>3){rev=!!sr.rev;fname=sr.name||'archivo';if(!buildPts(sr.pts)){rev=false;fname='N-640 (GPX)';buildPts(GPX_EMB)}}else{fname='N-640 (GPX)';buildPts(GPX_EMB)}}
