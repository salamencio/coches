<!DOCTYPE html>

<title>N-640 · Porto → San Tirso</title>
<style>

#ld{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;max-width:460px;gap:6px;z-index:2}#ld input{width:112px;cursor:text}#on{display:none;flex-basis:100%;gap:6px;flex-wrap:wrap;align-items:center}#on.show{display:flex}#st{color:#fff;font:12px system-ui,sans-serif;text-shadow:0 1px 3px #000}#ld label,#ld button,#ld input{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer}

<body><div id="wrap"><div id="stage"><canvas id="gl"></canvas><canvas id="c"></canvas></div>
<div id="ld"><label>📂 Cargar trazado (GPX / GeoJSON / CSV)<input type="file" id="f" accept=".gpx,.json,.geojson,.csv,.txt" hidden></label><button id="rv">↔ Invertir sentido</button><button id="ob">🌐 Online</button><div id="on"><input id="nm" placeholder="Tu nombre" maxlength="12"><button id="mk">Crear sala</button><input id="cd" placeholder="Código" maxlength="4"><button id="jn">Unirse</button><span id="st"></span></div></div>
<div id="pad"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-g="-1">G−</button><button data-g="1">G+</button><button data-k="d">■</button><button data-k="u">▲</button></div></div></div>
<script>
// ====== CONFIG (escala 1:1: 1 unidad = 1 metro) ======
let ROUTE_KM = 10,routeSrc='';            // longitud del tramo Porto → San Tirso (ajústala aquí)
const W=960,H=540,SL=4,DRAW=600,CAMH=3.6,Z0=4,RW=3.5,DEPTH=1/Math.tan(55*Math.PI/180),VMAX=69.4;
let L,N,M,CUR,Y;const FOG='#cde3ee';
const cv=document.getElementById('c'),g=cv.getContext('2d');cv.width=W;cv.height=H;

function setLen(m){L=m;N=Math.round(L/SL);M=N+DRAW+6;ROUTE_KM=Math.round(L/100)/10;tmax=L/24;CUR=new Float32Array(M);Y=new Float32Array(M);worldDirty=true}
function genRoad(){setLen(10000);routeSrc='trazado de ejemplo, carga uno real';
for(let i=0;i<M;i++){const z=i*SL,f=Math.max(0,Math.min(1,z/250,(L-z)/250));
 CUR[i]=f*1.3*(Math.sin(z/210)+.7*Math.sin(z/87+1.3))*(.55+.45*Math.sin(z/1300));
 Y[i]=f*(14*Math.sin(z/420)+6*Math.sin(z/150+1)+2*Math.sin(z/57));}}
const hs=(i,k)=>{let h=Math.imul(i*7919+k*104729,2654435761);h^=h>>>15;h=Math.imul(h,2246822519);h^=h>>>13;return (h>>>0)/4294967296};

const K={l:0,r:0,u:0,d:0},KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',KeyW:'u',KeyS:'d'};
addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='ArrowDown'){if(!e.repeat&&state==='play')shiftG(e.code==='ArrowUp'?1:-1);e.preventDefault()}if(KM[e.code]){K[KM[e.code]]=1;e.preventDefault()}if((e.code==='Space'||e.code==='Enter')&&state!=='play'){start();e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.code])K[KM[e.code]]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{K[k]=1;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=0))});
cv.addEventListener('pointerdown',()=>{if(state!=='play')start()});

// ====== estado ======
let state='menu',pos=0,speed=0,px=1.75,dmg=0,score=0,over=0,time=0,tmax=1,psi=0,steer=0,msg='',mt=0,shake=0,wcd=0,bg1=0,bg2=0,cars=[],reason='';
let ac,osc,gn;var RPM=900,gear=1,shiftT=0,prevThr=0,AU=null;
const GV=[16.7,27.8,38.9,50,61.1,72.2];
function tqf(r){const T=[[900,.35],[1500,.55],[3000,.8],[4500,1],[6500,.9],[7000,.7]];for(let i=1;i<T.length;i++)if(r<=T[i][0]){const a=T[i-1],b=T[i];return a[1]+(b[1]-a[1])*(r-a[0])/(b[0]-a[0])}return .7}
function snd(){if(ac){if(ac.resume)ac.resume();return}try{ac=new AudioContext();gn=ac.createGain();gn.gain.value=0;
 const dist=ac.createWaveShaper(),cv=new Float32Array(256);for(let i=0;i<256;i++)cv[i]=Math.tanh((i/128-1)*3.2);dist.curve=cv;
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=2.5;const eg=ac.createGain();eg.gain.value=0;
 const o1=ac.createOscillator(),o2=ac.createOscillator(),o3=ac.createOscillator();o1.type='sawtooth';o2.type='square';o3.type='sawtooth';
 const m=[.5,.3,.35].map(v=>{const x=ac.createGain();x.gain.value=v;return x});o1.connect(m[0]);o2.connect(m[1]);o3.connect(m[2]);m.forEach(x=>x.connect(dist));dist.connect(lp);lp.connect(eg);eg.connect(gn);
 const tb=ac.createOscillator(),tg=ac.createGain();tb.type='sine';tg.gain.value=0;tb.connect(tg);tg.connect(gn);
 const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;const wf=ac.createBiquadFilter();wf.type='bandpass';wf.frequency.value=900;const wg=ac.createGain();wg.gain.value=0;ns.connect(wf);wf.connect(wg);wg.connect(gn);
 gn.connect(ac.destination);[o1,o2,o3,tb,ns].forEach(x=>x.start());AU={o1,o2,o3,lp,eg,tb,tg,wg,nb}}catch(e){ac=null;AU=null}}
function burst(freq,q,gain,dur){const s=ac.createBufferSource();s.buffer=AU.nb;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const x=ac.createGain();x.gain.setValueAtTime(gain,ac.currentTime);x.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);s.connect(f);f.connect(x);x.connect(gn);s.start(0,Math.random(),dur+.05)}
function engineSound(dt){if(!ac||!AU)return;const t=ac.currentTime,thr=K.u?1:0,f=RPM/60*2;
 AU.o1.frequency.setTargetAtTime(f,t,.03);AU.o2.frequency.setTargetAtTime(f*.5,t,.03);AU.o3.frequency.setTargetAtTime(f*2.01,t,.03);
 AU.lp.frequency.setTargetAtTime(350+RPM*.55+thr*900,t,.05);
 let e=.1+.16*thr+.05*(RPM/7000);if(RPM>6900&&thr&&Math.floor(time*28)%2)e*=.25;AU.eg.gain.setTargetAtTime(e,t,.02);
 const boost=Math.min(1,Math.max(0,(RPM-2200)/3000))*thr;AU.tb.frequency.setTargetAtTime(2400+boost*4200,t,.1);AU.tg.gain.setTargetAtTime(boost*.012,t,.15);
 AU.wg.gain.setTargetAtTime(Math.min(.3,speed*speed*.00006),t,.1);
 if(prevThr&&!thr&&RPM>3200&&speed>8)burst(2600,2,.22,.45);
 if(!thr&&RPM>3000&&speed>6&&Math.random()<dt*14)burst(180+Math.random()*250,5,.45,.08);
 prevThr=thr;gn.gain.setTargetAtTime(.9,t,.05)}
function shiftG(d){const n=gear+d;if(n<1||n>6)return;if(d<0&&speed>GV[n-1]*1.04){toast('¡Demasiadas revoluciones!');return}gear=n;shiftT=.22;if(ac&&AU&&K.u&&d>0&&Math.random()<.6)burst(240,4,.5,.09)}
function gearHud(){if(state==='menu')return;const x=W-330,y=H-104,w=300;g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,y,w,12);const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#4ade80');gr.addColorStop(.75,'#facc15');gr.addColorStop(1,'#ef4444');g.fillStyle=gr;g.fillRect(x,y,w*Math.min(1,RPM/7500),12);
 T(String(gear),W-250,H-42,62,'center','#ffe08a');T('MARCHA',W-250,H-18,14,'center');T(Math.round(RPM/10)*10+' rpm',x,y-6,14,'left');if(RPM>6300&&gear<6&&Math.floor(time*8)%2)T('▲ SUBE',W-250,H-80,18,'center','#ff6b6b')}
document.querySelectorAll('#pad button[data-g]').forEach(b=>b.addEventListener('pointerdown',e=>{if(state==='play')shiftG(+b.dataset.g);e.preventDefault()}));
const toast=t=>{msg=t;mt=1.6};
function mkCars(){const a=[],cols=['#e9ebee','#2b3f5c','#1b1c1e','#a32a2a','#c8ccd1','#4d5560','#f4f4f2','#6b7b8c'];let z=170;
 while(z<L-120){const o=Math.random()<.45,t=Math.random()<.2,sp=o?17+Math.random()*9:(t?12+Math.random()*4:15+Math.random()*9);
  a.push({z,x:(o?-1.75:1.75)+(Math.random()-.5)*.4,v:o?-sp:sp,v0:o?-sp:sp,w:t?2.5:1.8,len:t?9:4.4,tall:t,col:t?['#2a5d9f','#c0392b','#e9ebee'][Math.random()*3|0]:cols[Math.random()*cols.length|0],hit:0,pass:0});
  z+=70+Math.random()*130}return a}
function start(){snd();gear=1;shiftT=0;pos=0;speed=0;px=1.75;psi=0;steer=0;dmg=0;score=0;over=0;time=0;msg='';cars=mkCars();state='play'}
cars=mkCars();

genRoad();cars=mkCars();
function update(dt){
 time+=dt;const pz=pos+Z0,ps=Math.floor(pz/SL),sp=speed/VMAX;
 const gv=GV[gear-1];let rpm=Math.max(900,7000*speed/gv);if(gear<=2&&K.u&&speed<gv*.2)rpm=Math.max(rpm,2800);shiftT-=dt;let acc=-.00028*speed*speed;if(shiftT>0)acc-=.3;else if(K.u){acc+=rpm<7000?1.7*(72.2/gv)*tqf(rpm)*(gear<=2&&speed<gv*.2?.85:1):-1}else acc-=1+1.8*Math.min(1,rpm/7000)*(72.2/gv)/4.3*.7;if(K.d)acc-=18;if(speed>gv*1.02)acc-=8;speed+=acc*dt;RPM=rpm;
 
 if(Math.abs(px)>4.3&&speed>11){speed-=14*dt;shake=Math.max(shake,.15)}
 speed=Math.max(0,Math.min(VMAX,speed));
 steer+=((K.r-K.l)-steer)*Math.min(1,dt*5);const vv=Math.min(1,speed/3)*Math.max(speed,10);psi+=(vv*steer*.015*Math.min(1,28/Math.max(speed,28))-speed*CUR[ps]*.0012-3.4*psi)*dt;px+=vv*psi*dt;
 wcd-=dt;if(px>8||px<-8){px=Math.sign(px)*8;speed*=.6;if(wcd<=0){dmg+=8;shake=.4;wcd=1;toast('¡Cuneta!')}}
 pos+=speed*dt;
 bg1+=.001*CUR[ps]*speed*dt/SL;bg2+=.002*CUR[ps]*speed*dt/SL;
 for(const c of cars){c.hit=Math.max(0,c.hit-dt);
  if(c.v0>0){let lim=c.v0;
   for(const d of cars){if(d!==c&&d.v0>0&&Math.abs(d.x-c.x)<1&&d.z>c.z&&d.z-c.z-(c.len+d.len)/2<14)lim=Math.min(lim,d.v)}
   if(Math.abs(px-c.x)<1.6&&pz>c.z&&pz-c.z-(c.len+4.4)/2<14)lim=Math.min(lim,speed);
   c.v+=Math.max(-8*dt,Math.min(2*dt,lim-c.v))}
  c.z+=c.v*dt;
  if(!c.hit&&Math.abs(c.z-pz)<(4.4+c.len)/2&&Math.abs(c.x-px)<(1.8+c.w)/2-.1){
   const rel=speed-c.v;c.hit=2;dmg+=Math.max(4,Math.abs(rel))*(c.v<0?1.4:.9);shake=.6;
   if(c.v<0){speed*=.25;toast('¡CHOQUE FRONTAL!')}else{if(rel>0)speed=Math.min(speed,c.v*.9);else c.v=Math.min(c.v,speed);toast('¡Choque!')}
   px+=(px>=c.x?1:-1)*.8}
  if(!c.pass&&pz>c.z+3){c.pass=1;if(c.v0>0){score+=100;over++}else if(Math.abs(c.x-px)<2.7){score+=50;toast('¡Por los pelos! +50')}}}
 shake=Math.max(0,shake-dt*2);mt-=dt;
 engineSound(dt);
 if(pz>=L-15){state='win';score+=Math.max(0,Math.floor((tmax-time)*5));endSnd()}
 else if(dmg>=100){state='over';reason='Coche siniestro total';endSnd()}
 else if(time>=tmax){state='over';reason='Se acabó el tiempo';endSnd()}
}
function endSnd(){if(gn)gn.gain.value=0}

// ====== dibujo ======
const sx=new Float32Array(DRAW+3),sy=new Float32Array(DRAW+3),sw=new Float32Array(DRAW+3),ss=new Float32Array(DRAW+3),xoA=new Float32Array(DRAW+3),clip=new Float32Array(DRAW+3),fogA=new Float32Array(DRAW+3);
function zone(z,s){const f=FZ?FZ[(z/SL)|0]:0;if(f&(s<0?1:2))return 1;const a=Math.sin(z/260+s*2.1)+.7*Math.sin(z/97+s*5),b=Math.sin(z/530+s*1.3),r=a>.9?1:b>.6?2:a<-1?3:0;return FZ&&r===1?0:r}
const ZC=[[84,158,66],[46,102,50],[150,150,84],[128,112,70]];
function gcol(z,s,alt){const c=ZC[zone(z,s)],d=alt?7:0;return 'rgb('+(c[0]+d)+','+(c[1]+d)+','+(c[2]+d)+')'}
function q4(xa,ya,xb,yb,la,lb,ha,hb,c){poly(xa,ya-la,xb,yb-lb,xb,yb-lb-hb,xa,ya-la-ha,c)}
function poly(a,b,c,d,e,f,h,i,col){g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.lineTo(h,i);g.closePath();g.fill()}
function lane(x1,y1,w1,x2,y2,w2,c,hw,col){poly(x1+w1*(c-hw),y1,x1+w1*(c+hw),y1,x2+w2*(c+hw),y2,x2+w2*(c-hw),y2,col)}
function bgLayer(off,base,amp,col){g.fillStyle=col;g.beginPath();g.moveTo(0,H/2+2);for(let x=0;x<=W;x+=12){const u=x/W+off;g.lineTo(x,H/2-base-amp*(Math.sin(u*12.566)+.6*Math.sin(u*31.4+1)+.3*Math.sin(u*69+2)+.14*Math.sin(u*151+4)))}g.lineTo(W,H/2+2);g.fill()}
function T(t,x,y,sz,al,col){g.font='bold '+sz+'px system-ui,sans-serif';g.textAlign=al||'left';g.lineWidth=sz/6;g.strokeStyle='rgba(0,0,0,.6)';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=col||'#fff';g.fillText(t,x,y)}
function car(cx,by,w,col,front,tall,brk){const h=w*(tall?1.15:.7);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(cx,by,w*.6,w*.08,0,0,6.3);g.fill();
 g.fillStyle='#111';g.fillRect(cx-w*.47,by-h*.2,w*.15,h*.2);g.fillRect(cx+w*.32,by-h*.2,w*.15,h*.2);g.fillStyle=col;
 if(tall){g.fillRect(cx-w/2,by-h,w,h*.92);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(cx-w/2,by-h*.5,w,h*.04)}
 else{g.fillRect(cx-w/2,by-h*.6,w,h*.5);g.beginPath();g.moveTo(cx-w*.42,by-h*.58);g.lineTo(cx-w*.32,by-h);g.lineTo(cx+w*.32,by-h);g.lineTo(cx+w*.42,by-h*.58);g.fill();
  g.fillStyle='#1b2a35';g.beginPath();g.moveTo(cx-w*.35,by-h*.6);g.lineTo(cx-w*.28,by-h*.93);g.lineTo(cx+w*.28,by-h*.93);g.lineTo(cx+w*.35,by-h*.6);g.fill()}
 const ly=tall?by-h*.32:by-h*.42,lh=Math.max(1,h*.1);g.fillStyle=front?'#fffbd0':(brk?'#ff3030':'#b01c1c');
 g.fillRect(cx-w*.46,ly,w*.2,lh);g.fillRect(cx+w*.26,ly,w*.2,lh);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(cx-w*.2,by-h*.2,w*.4,h*.06)}
function tree(x,y,k,h){g.fillStyle='#4a3626';g.fillRect(x-.25*k,y-2.6*k,.5*k,2.6*k);g.fillStyle=h<.5?'#2d6a34':'#3a7d3a';
 g.beginPath();g.ellipse(x,y-4.6*k,2.1*k,2.7*k,0,0,6.3);g.fill();g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.ellipse(x-.5*k,y-5.2*k,1.1*k,1.6*k,0,0,6.3);g.fill()}
function house(x,y,k,h){const w=9*k,hh=5*k;g.fillStyle=h<.5?'#efe9dc':'#d9c9a8';g.fillRect(x-w/2,y-hh,w,hh);g.fillStyle='#9a4a2c';
 g.beginPath();g.moveTo(x-w*.58,y-hh);g.lineTo(x,y-hh-2.6*k);g.lineTo(x+w*.58,y-hh);g.fill();g.fillStyle='#3b3b3b';g.fillRect(x-w*.1,y-2.2*k,w*.2,2.2*k);g.fillStyle='#5b7d94';g.fillRect(x-w*.38,y-3.6*k,1.3*k,1.2*k);g.fillRect(x+w*.25,y-3.6*k,1.3*k,1.2*k)}
function gantry(x,y,k,txt){g.fillStyle='#6b7075';g.fillRect(x-5.4*k,y-6.4*k,.5*k,6.4*k);g.fillRect(x+4.9*k,y-6.4*k,.5*k,6.4*k);
 g.fillStyle='#1c5fa8';g.fillRect(x-5.6*k,y-7.6*k,11.2*k,2.2*k);if(k>3)T(txt,x,y-5.95*k,Math.min(60,1.5*k),'center')}
function sprites(n,i){const k=ss[n]*W/2,X=sx[n],B=sy[n];g.save();g.beginPath();g.rect(0,0,W,clip[n]);g.clip();g.globalAlpha=1-fogA[n];
 if(n>0){const h1=hs(i,1),h2=hs(i,2),h3=hs(i,3);
  if(i%3===0){for(const s of[-1,1]){g.fillStyle='#f3f3f3';g.fillRect(X+s*3.95*k-.08*k,B-1*k,.16*k,1*k);g.fillStyle='#d33';g.fillRect(X+s*3.95*k-.08*k,B-.75*k,.16*k,.2*k)}}
  if(k>.18){for(const s of[-1,1]){const zn=zone(i*SL,s),pr=zn===1?.9:zn===0?.1:.05,cnt=zn===1?2:1;
   for(let t=0;t<cnt;t++){if(hs(i,10+t+(s+1)*3)<pr)tree(X+s*k*(4.8+hs(i,20+t+s)*(zn===1?20:30)),B,k*(zn===1?1.15:1),hs(i,30+t))}}
  const k2=ss[n+1]*W/2,xa=sx[n],xb=sx[n+1],ya=sy[n],yb=sy[n+1];
  for(const s of[-1,1]){const zn=zone(i*SL,s);
   if(s*CUR[i]<-1.1)q4(xa+s*k*4.3,ya,xb+s*k2*4.3,yb,.55*k,.55*k2,.4*k,.4*k2,'#c4c9cd');
   else if(zn!==1&&hs(i>>4,3+s)<.55)q4(xa+s*k*5.6,ya,xb+s*k2*5.6,yb,0,0,k,k2,i%2?'#8a877c':'#7d7a70')}}
  if(i%41===7)house(X-k*(11+h1*6),B,k,h2);if(i%53===11)house(X+k*(11+h2*6),B,k,h1);
