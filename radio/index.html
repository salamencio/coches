<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio España</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#d9381e;--bd:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--tx:#f1efe9;--mut:#9c9a93;--ac:#ff6a4d;--bd:#34332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--tx:#f1efe9;--mut:#9c9a93;--ac:#ff6a4d;--bd:#34332f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:130px}
header{max-width:720px;margin:0 auto;padding:24px 16px 8px}
h1{margin:0 0 4px;font-size:26px}
p.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
input[type=search],input[type=text],input[type=url]{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
main{max-width:720px;margin:0 auto;padding:8px 16px}
.chips{display:flex;gap:8px;margin:6px 0 12px}.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:left;cursor:pointer;color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:4px}
.st:hover{border-color:var(--ac)}
.st.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.st b{font-size:15px}.st span{font-size:12px;color:var(--mut)}
.dot{width:100%;height:64px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:.5px;margin-bottom:6px;font-family:Impact,"Arial Black",system-ui,sans-serif}
.dot img{display:block;width:100%;height:54px;object-fit:contain;padding:3px}
.st:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
@media(max-width:400px){#vol{width:60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
details{margin:18px 0}summary{cursor:pointer;color:var(--mut);font-size:14px}
.add{display:grid;gap:8px;margin-top:10px}
button.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
#play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer;flex:none}
#info{flex:1;min-width:0}#nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stt{font-size:12px;color:var(--mut)}#stt a{color:var(--ac)}
#vol{width:90px;accent-color:var(--ac)}
.note{font-size:12px;color:var(--mut);margin:16px 0}
</style>
</head>
<body>
<header>
  <h1>📻 Radio España</h1>
  <p class="sub">Las emisoras principales, en directo.</p>
  <input type="search" id="q" aria-label="Buscar emisora" placeholder="Buscar emisora…">
</header>
<main>
  <div class="chips"><button class="chip" data-r="all" onclick="reg='all';render()">Todas</button><button class="chip" data-r="nac" onclick="reg='nac';render()">Nacionales</button><button class="chip" data-r="gal" onclick="reg='gal';render()">Galicia</button></div>
  <div class="grid" id="grid"></div>
  <details>
    <summary>Añadir o corregir una emisora (mismo nombre = sustituye su URL)</summary>
    <div class="add">
      <input type="text" id="an" aria-label="Nombre de la emisora" placeholder="Nombre">
      <input type="url" id="au" aria-label="URL HTTPS del stream" placeholder="URL del stream (mp3, aac o m3u8)">
      <button class="btn" id="ab">Guardar emisora</button>
      <button class="chip" id="reset">Restaurar emisoras originales</button>
      <span id="form-status" role="status"></span>
    </div>
  </details>
  <p class="note">El reproductor prueba las conexiones alternativas automáticamente. Si una emisión se interrumpe, pulsa ▶ para reintentar o consulta su web oficial.</p>
</main>
<div class="bar"><div>
  <button id="play" aria-label="Reproducir/Pausar">▶</button>
  <div id="info"><div id="nm">Elige una emisora</div><div id="stt" role="status" aria-live="polite">—</div></div>
  <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" aria-label="Volumen">
</div></div>
<audio id="au_el" preload="none"></audio>

  cur = s; idx = 0; wanted = true; failed = false;
  $("nm").textContent = s.n; render(); load();
}
function load() {
  stopSource();
  const urls = [...new Set([cur.u, ...(cur.a || [])])];
  const url = urls[idx], my = token;
  // A new element isolates queued media events and play promises from the previous stream.
  const audio = document.createElement("audio");
  audio.id = "au_el"; audio.preload = "none"; audio.volume = Number($("vol").value) ** 2;
  au.replaceWith(audio); au = audio;
  let handled = false;
  const current = () => my === token && wanted;
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => bad("La conexión no responde"), 20000); };
  const bad = reason => {
    if (!current() || handled) return;
    handled = true;
    if (idx + 1 < urls.length) { idx++; load(); }
    else {
      wanted = false; failed = true; stopSource(); playButton(false);
      status(reason + ". Pulsa ▶ para reintentar", true);
    }
  };
  const play = () => {
    if (!current()) return;
    audio.play().catch(e => {
      if (!current() || e.name === "AbortError") return;
      if (e.name === "NotAllowedError") {
        wanted = false; clearTimeout(timer); playButton(false);
        status("Pulsa ▶ para permitir la reproducción");
      } else bad("No se pudo reproducir esta emisora");
    });
  };
  audio.addEventListener("playing", () => {
    if (!current()) return;
    clearTimeout(timer); timer = 0; playButton(true); status("En directo");
  });
  for (const event of ["waiting", "stalled"]) audio.addEventListener(event, () => {
    if (current()) { status("Recuperando la conexión…"); if (!timer) arm(); }
  });
  audio.addEventListener("error", () => bad("No se pudo conectar con la emisora"));
  audio.addEventListener("ended", () => bad("La emisión se ha interrumpido"));
  audio.addEventListener("pause", () => {
    if (!current() || handled || audio.ended || audio.error) return;
    wanted = false; clearTimeout(timer); timer = 0; playButton(false); status("En pausa");
  });
  status(idx ? "Probando conexión alternativa…" : "Conectando…"); playButton(true); arm();
  if (!validURL(url)) { bad("La dirección de la emisora no es válida"); return; }
  const isHls = /\.m3u8(?:[?#]|$)/i.test(url);
  // Prefer hls.js where MediaSource is supported. Some native HLS implementations
  // request byte ranges of compressed playlists and reject these live servers.
  if (isHls && window.Hls?.isSupported()) {
    const engine = new Hls({manifestLoadingTimeOut: 12000, levelLoadingTimeOut: 12000, fragLoadingTimeOut: 15000});
    hls = engine;
    engine.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) bad("No se pudo cargar la emisión HLS"); });
    engine.on(Hls.Events.MEDIA_ATTACHED, () => { if (current()) engine.loadSource(url); });
    engine.on(Hls.Events.MANIFEST_PARSED, play);
    engine.attachMedia(audio);
  } else if (isHls && !audio.canPlayType("application/vnd.apple.mpegurl")) {
    bad("Este navegador no admite audio HLS");
  } else { audio.src = url; play(); }
}
$("play").onclick = () => {
  if (!cur) { tune(all()[0]); return; }
  if (wanted) {
    wanted = false; stopSource(); playButton(false); status("En pausa");
  } else {
    if (failed) idx = 0;
    wanted = true; failed = false; load();
  }
};
$("vol").oninput = e => { au.volume = Number(e.target.value) ** 2; };
$("q").oninput = render;
$("ab").onclick = () => {
  const n = $("an").value.trim(), u = $("au").value.trim();
  if (!n || !validURL(u)) { $("form-status").textContent = "Escribe un nombre y una dirección HTTPS válida."; return; }
  const base = ST.find(s => normalize(s.n) === normalize(n));
  const name = base?.n || n;
  custom = custom.filter(c => normalize(c.n) !== normalize(name));
  custom.push({n: name, u, g: "Personalizada"});
  try { localStorage.setItem("custom", JSON.stringify(custom)); $("form-status").textContent = "Emisora guardada."; }
  catch { $("form-status").textContent = "Emisora añadida para esta sesión. El navegador no permite guardarla."; }
  $("an").value = $("au").value = ""; render();
  if (cur?.n === name) tune(all().find(s => s.n === name));
};
$("reset").onclick = () => {
  custom = [];
  try { localStorage.removeItem("custom"); } catch {}
  $("form-status").textContent = "Restauradas las emisoras originales.";
  if (cur) { const station = ST.find(s => s.n === cur.n); if (station) { if (wanted) tune(station); else cur = station; } }
  render();
};
window.addEventListener("online", () => { if (cur && wanted) load(); });
au.volume = .25; render();

</script>
</body>
